apiVersion: v1
kind: Namespace
metadata:
  name: github
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner
  namespace: github
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-binding
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github
roleRef:
  kind: ClusterRole
  name: github-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-secrets
  namespace: github
type: Opaque
stringData:
  RUNNER_URL: "https://github.com/ashishkumar256/terrateam-demo"
  RUNNER_TOKEN: "RT"
  RUNNER_NAME: "infra"
  RUNNER_GROUP: "Default"
  RUNNER_LABELS: "infra"
  RUNNER_WORKDIR: "_work"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-work-pvc
  namespace: github
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Uses your default Rancher provisioner
  resources:
    requests:
      storage: 10Gi # Adjust size based on your workflow needs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner
      securityContext:
        fsGroup: 999
      containers:
        # --- Main runner container ---
        - name: runner
          image: ashishkumar256/github-runner:1
          envFrom:
            - secretRef:
                name: github-runner-secrets
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
          volumeMounts:
            - name: runner-work
              mountPath: /actions-runner/_work

        # --- Docker-in-Docker sidecar ---
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true # required for DinD to run its own daemon
          args:
            - "--host=tcp://0.0.0.0:2375"  # unauthenticated, only reachable inside the pod's network namespace
            - "--host=unix:///var/run/docker.sock"
          volumeMounts:
            # SAME path as the runner container, so bind-mount paths match
            - name: runner-work
              mountPath: /actions-runner/_work
            - name: docker-storage
              mountPath: /var/lib/docker

      volumes:
        - name: runner-work
          persistentVolumeClaim:
            claimName: runner-work-pvc
        - name: docker-storage
          emptyDir: {} # Docker's own image/layer storage for the sidecar; ephemeral is fine
